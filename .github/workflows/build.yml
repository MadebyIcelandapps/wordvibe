# Builds SoundSpell on real Windows (checks it compiles with the csc that ships
# in Windows), runs the spelling checks, and uploads a ready-to-install zip.
name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Version numbers match
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          $code = (Select-String 'public const string Version = "(.*)"' src/Updater.cs).Matches[0].Groups[1].Value
          if ($file -ne $code) { throw "VERSION says $file but src/Updater.cs says $code" }
          if (-not (Select-String -Path WHATSNEW.md -Pattern "^## $([regex]::Escape($file))$" -Quiet)) { throw "WHATSNEW.md has no notes for $file" }
      - name: Spelling checks
        run: ./test/run.ps1
      - name: Build SoundSpell.exe
        run: ./build.ps1
      - name: Try it in Notepad
        run: ./test/e2e.ps1
      - name: Strip opacity changes what you see
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          # A solid blue window fills the screen behind the strip.
          $blue = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', 'Add-Type -AssemblyName System.Windows.Forms; $f = New-Object Windows.Forms.Form; $f.BackColor = [Drawing.Color]::FromArgb(0,0,255); $f.FormBorderStyle = ''None''; $f.WindowState = ''Maximized''; [Windows.Forms.Application]::Run($f)'
          Start-Sleep 5
          $key = 'HKCU:\Software\SoundSpell'
          New-Item $key -Force | Out-Null
          Set-ItemProperty $key Colours 'Dark'
          $env:SOUNDSPELL_LOG = Join-Path $env:TEMP 'strip-test.log'
          $t = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -ErrorAction SilentlyContinue).EnableTransparency
          Write-Host "Windows transparency effects setting: [$t]"
          $blueness = @{}
          foreach ($blur in 0, 1) {
            foreach ($opacity in 10, 80) {
              Set-ItemProperty $key GlassBlur $blur -Type DWord
              Set-ItemProperty $key GlassOpacity $opacity -Type DWord
              Remove-Item $env:SOUNDSPELL_LOG -ErrorAction SilentlyContinue
              $p = Start-Process ./SoundSpell.exe -ArgumentList '--strip-test' -PassThru
              Start-Sleep -Milliseconds 2200
              $m = (Select-String -Path $env:SOUNDSPELL_LOG -Pattern 'strip at (\d+),(\d+),(\d+),(\d+) .*mode=(\w+)' | Select-Object -Last 1).Matches[0].Groups
              $x = [int]$m[1].Value; $y = [int]$m[2].Value; $w = [int]$m[3].Value; $h = [int]$m[4].Value
              $bmp = New-Object Drawing.Bitmap 1, 1
              [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($x + $w - 60, $y + [int]($h / 2), 0, 0, $bmp.Size)
              $c = $bmp.GetPixel(0, 0)
              Write-Host "blur=$blur opacity=$opacity drawn as $($m[5].Value): colour in the blank part = ($($c.R), $($c.G), $($c.B))"
              Get-Content $env:SOUNDSPELL_LOG | Where-Object { $_ -match 'strip glass' }
              $blueness["$blur/$opacity"] = [int]$c.B
              $p.WaitForExit()
            }
          }
          Stop-Process $blue.Id -Force
          Remove-Item $key -Recurse -Force
          # A dark tint over blue: more opacity must mean less blue.
          if ($blueness['0/10'] - $blueness['0/80'] -lt 60) { throw 'see-through (no blur): the opacity slider does not change the look' }
          # Windows' blur is optional and known to draw the strip solid on some set-ups (this one included).
          if ($blueness['1/10'] - $blueness['1/80'] -lt 60) { Write-Host '::warning::frosted blur: Windows drew the strip solid here; see-through (the default) is fine' }
          Write-Host 'the opacity slider changes the look (see-through, the default)'
      - name: Update window shows what is new
        run: |
          $env:SOUNDSPELL_LOG = Join-Path $env:TEMP 'update-window.log'
          $p = Start-Process ./SoundSpell.exe -ArgumentList '--update-window-test', "`"$PWD\WHATSNEW.md`"" -PassThru
          Start-Sleep 2
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $area.Width, $area.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\update-window.png")
          $p.WaitForExit()
          Get-Content $env:SOUNDSPELL_LOG
          if ($p.ExitCode -ne 0) { throw "update window test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path $env:SOUNDSPELL_LOG -Pattern 'update window shown: [1-9]' -Quiet)) { throw 'update window did not show its notes' }
      - name: Natural voice downloads and speaks
        run: |
          # Every voice in the list can be downloaded.
          $urls = Select-String -Path src/Voice.cs -Pattern 'new NaturalVoice\("([^"]+)", "[^"]+", "([^"]+)"\)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/$($_.Groups[2].Value)/$($_.Groups[1].Value).onnx" }
          foreach ($u in $urls) { $r = Invoke-WebRequest $u -Method Head -UseBasicParsing; Write-Host "$($r.StatusCode) $u" }
          # One voice, all the way to a WAV file.
          $wav = Join-Path $env:TEMP 'voice-test.wav'
          $p = Start-Process ./SoundSpell.exe -ArgumentList '--voice-test', 'en_GB-cori-medium', "`"$wav`"", '"Hello Niamh, see you on Wednesday."' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "voice test failed with $($p.ExitCode)" }
          $size = (Get-Item $wav).Length
          Write-Host "spoke $size bytes of audio"
          if ($size -lt 20000) { throw 'audio too short' }
      - name: Update from GitHub, then uninstall
        run: |
          ./update.ps1 -Ref ${{ github.sha }}
          Start-Sleep 5
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SoundSpell\SoundSpell.exe'
          if (-not (Test-Path $exe)) { throw 'not installed' }
          if (-not (Get-Process SoundSpell -ErrorAction SilentlyContinue)) { throw 'not running after install' }
          & (Join-Path $env:LOCALAPPDATA 'Programs\SoundSpell\uninstall.ps1')
          Start-Sleep 2
          if (Test-Path $exe) { throw 'still there after uninstall' }
          if (Get-Process SoundSpell -ErrorAction SilentlyContinue) { throw 'still running after uninstall' }
          Write-Host 'update, install and uninstall ok'
          exit 0
      - name: Package
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item SoundSpell.exe, Install.cmd, install.ps1, uninstall.ps1, update.ps1, build.ps1, VERSION, WHATSNEW.md, words.txt, irish.txt, homophones.txt, README.md pkg
          Copy-Item src pkg -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: SoundSpell
          path: pkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            strip.png
            update-window.png
          if-no-files-found: ignore
